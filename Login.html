<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reader's Digest - Login</title>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-image: url("Images/1.jpg");
      background-size: cover;
      background-position: center;
    }

    .wrapper {
      width: 420px;
      background: transparent;
      color: rgb(8, 103, 74);
      padding: 30px;
      border-radius: 10px;
      backdrop-filter: blur(15px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
    }

    .wrapper h1 {
      font-size: 36px;
      text-align: center;
      margin-bottom: 20px;
    }

    /* Messages */
    .message {
      padding: 10px;
      border-radius: 5px;
      margin-bottom: 15px;
      font-size: 14px;
      display: none;
      text-align: center;
    }
    .error-message {
      background: rgba(255, 200, 200, 0.9);
      color: #c33;
    }
    .success-message {
      background: rgba(200, 255, 200, 0.9);
      color: #3c3;
    }

    .input-box {
      width: 100%;
      margin: 15px 0;
      position: relative;
    }
    .input-box input {
      width: 100%;
      padding: 10px 40px 10px 20px;
      border: 2px solid rgb(8, 103, 74);
      background: transparent;
      outline: none;
      font-size: 16px;
      color: rgb(8, 103, 103);
      border-radius: 40px;
    }
    .input-box input::placeholder {
      color: rgb(8, 103, 106);
    }
    .input-box input:focus {
      border-color: rgb(233, 46, 155);
    }
    .input-box i {
      position: absolute;
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
      color: rgb(217, 77, 168);
    }

    .remember-forgot {
      display: flex;
      justify-content: space-between;
      font-size: 14.5px;
      margin: -15px 0 15px;
    }
    .remember-forgot label {
      display: flex;
      align-items: center;
      cursor: pointer;
    }
    .remember-forgot label input {
      accent-color: rgb(233, 46, 155);
      margin-right: 3px;
    }
    .remember-forgot a {
      color: rgb(8, 86, 94);
      text-decoration: none;
    }
    .remember-forgot a:hover {
      text-decoration: underline;
    }

    .btn {
      width: 100%;
      height: 45px;
      padding: 10px;
      background: linear-gradient(135deg, rgb(233, 46, 155), rgb(217, 77, 168));
      color: white;
      border: none;
      cursor: pointer;
      font-size: 16px;
      font-weight: 600;
      border-radius: 40px;
      transition: transform 0.2s;
    }
    .btn:hover {
      transform: translateY(-2px);
    }
    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .register-link {
      text-align: center;
      margin-top: 15px;
      font-size: 14.5px;
    }
    .register-link p a {
      color: rgb(8, 86, 94);
      text-decoration: none;
      font-weight: 600;
    }
    .register-link p a:hover {
      text-decoration: underline;
    }

    /* Toggle between forms */
    .form-toggle {
      display: none;
    }
    .form-toggle.active {
      display: block;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <!-- Messages -->
    <div class="error-message message" id="error-message"></div>
    <div class="success-message message" id="success-message"></div>

    <!-- Login Form -->
    <form id="login-form" class="form-toggle active">
      <h1>Login</h1>
      <div class="input-box">
        <input type="email" id="login-email" placeholder="Email" required>
        <i class="fa-solid fa-envelope"></i>
      </div>
      <div class="input-box">
        <input type="password" id="login-password" placeholder="Password" required>
        <i class="fa-solid fa-lock"></i>
      </div>
      <div class="remember-forgot">
        <label>
          <input type="checkbox" id="remember-me">Remember me
        </label>
        <a href="#" id="forgot-password-link">Forgot password?</a>
      </div>
      <button type="submit" class="btn" id="login-btn">Login</button>
      <div class="register-link">
        <p>Don't have an account? <a href="#" id="show-signup">Register</a></p>
      </div>
    </form>

    <!-- Signup Form -->
    <form id="signup-form" class="form-toggle">
      <h1>Sign Up</h1>
      <div class="input-box">
        <input type="email" id="signup-email" placeholder="Email" required>
        <i class="fa-solid fa-envelope"></i>
      </div>
      <div class="input-box">
        <input type="password" id="signup-password" placeholder="Password (min 6 characters)" required minlength="6">
        <i class="fa-solid fa-lock"></i>
      </div>
      <div class="input-box">
        <input type="password" id="signup-password-confirm" placeholder="Confirm Password" required>
        <i class="fa-solid fa-lock"></i>
      </div>
      <button type="submit" class="btn" id="signup-btn">Sign Up</button>
      <div class="register-link">
        <p>Already have an account? <a href="#" id="show-login">Login</a></p>
      </div>
    </form>
  </div>

  <!-- Firebase Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/firebase@10.7.1/firebase-app-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/firebase@10.7.1/firebase-auth-compat.js"></script>
  <script src="Scripts/firebase-config.js"></script>
  <script src="Scripts/auth.js"></script>
</body>
</html>
